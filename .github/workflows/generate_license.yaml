name: Generate License File
on:
  workflow_dispatch:
    inputs:
      # type for license
      licType:
        description: >
          type for license.
          Optional presets: 
          - 'eval'
          - 'prototype'
          - 'full'
        required: false  
        type: string    
        default: 'eval'
      duration:
        description: 'License valid duration in days (default: 30)'
        required: false
        type: number # Parameter type: number (ensures integer input)
        default: 30 # Default value: 30 days (consistent with the original hardcoded logic)

env:
  # Update the commit id when a major/minor version update is required
  BRANCH_NAME: license_generate
  COMMIT_TITLE: "Generate license file"

jobs:
  patch-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.CI4RF }}
          persist-credentials: false

      - name: Checkout infra
        uses: actions/checkout@v3
        with:
          repository: RapidFlex/alkaid_infra
          path: utils/alkaid_infra
          token: ${{ secrets.CI4RF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push changes # push the output folder to your repo
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{env.BRANCH_NAME}}
          force: true

      - name: Generate license
        run: |
          make license LIC_TYPE=${{ github.event.inputs.licType }}  LIC_DURATION=${{ github.event.inputs.duration }}
      
      - name: Upload license and MD5 files
        uses: actions/upload-artifact@v4
        with:
          name: aaee-licenses
          path: |
            ./projects/AAEE/*.lic
            ./projects/AAEE/*.lic.md5
          retention-days: 3
